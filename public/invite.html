    <style>
      body {
        margin: 0;
        background: #0d0f12;
        color: #f4f4f0;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #15181e;
        border: 1px solid #343a46;
        border-top: 3px solid #ffcf00;
        padding: 24px 32px;
        text-align: center;
      }
      a { color: #ffcf00; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="card">
      <p>オンライン対戦ルームへ移動しています...</p>
      <p><a id="fallbackLink" href="./">自動で切り替わらない場合はこちらをクリック</a></p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var room = params.get('room');
        var target = room ? './?room=' + encodeURIComponent(room) : './';
        var link = document.getElementById('fallbackLink');
        if (link) link.href = target;
        window.location.replace(target);
      })();
    </script>
  </body>
